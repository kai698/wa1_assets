init_state:
  root_pos: [0, 0, 1]
  root_rot: [0, 0, 0, 1]
  joint_pos:
    ".*": 0

mujoco:
  compiler:
    balanceinertia: false
    discardvisual: false
  default_joint:
    armature: 0.005
    damping: 0.01
    frictionloss: 0.01
  visual_geom:
    contype: 0
    conaffinity: 0
    group: 2
    mass: 0
    density: 0
  collision_geom:
    group: 3
    mass: 0
    density: 0
    friction: [1, 0.005, 0.0001]
    condim: 4
  equality:
    connect:
      solref: [0.001, 1]
      solimp: [0.97, 0.99, 0.001]
  scene:
    option:
      timestep: 0.0005
      gravity: [0, 0, -9.81]
      iterations: 50
      tolerance: 1.0e-10
      impratio: 10
      cone: pyramidal
    headlight:
      diffuse: [0.6, 0.6, 0.6]
      ambient: [0.3, 0.3, 0.3]
      specular: [0, 0, 0]
    haze: [0.15, 0.25, 0.35, 1]
    grid_texture:
      type: 2d
      name: grid
      builtin: checker
      width: 256
      height: 256
      rgb1: [0.3, 0.3, 0.3]
      rgb2: [0.4, 0.4, 0.4]
    grid_material:
      name: grid
      texture: grid
      texrepeat: [2, 2]
      texuniform: true
      reflectance: 0
    light:
      directional: true
      diffuse: [0.8, 0.8, 0.8]
      specular: [0.2, 0.2, 0.2]
      pos: [0, 0, 5]
      dir: [0, 0, -1]
    floor:
      name: floor
      type: plane
      size: [0, 0, 0.05]
      material: grid
      condim: 3
      friction: [1, 0.005, 0.005]
